[project]
name = "regimelib"
version = "0.0.1"
description = "QuantLib's models with a hidden Markov regime, priced by the fast-switching expansion"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "mpmath"]
[project.optional-dependencies]
test = ["pytest", "QuantLib"]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["regimelib*"]
