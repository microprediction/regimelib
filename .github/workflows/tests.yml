name: tests
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # one BLAS thread per test worker: the matrices are small, and threads times workers oversubscribes the runner
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e . pytest pytest-xdist QuantLib
      # a pull request runs the tests not marked slow; main and the nightly run the whole suite
      - if: github.event_name == 'pull_request'
        run: python -m pytest -q -n auto -m "not slow" --durations=25 tests
        timeout-minutes: 30
      - if: github.event_name != 'pull_request'
        run: python -m pytest -q -n auto --durations=25 tests
        timeout-minutes: 90
